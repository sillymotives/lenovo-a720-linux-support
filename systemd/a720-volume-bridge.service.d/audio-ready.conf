[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=3

# PulseAudio and PipeWire can start before the default sink is usable.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do /usr/bin/pactl get-sink-volume @DEFAULT_SINK@ >/dev/null 2>&1 && exit 0; /usr/bin/wpctl get-volume @DEFAULT_AUDIO_SINK@ >/dev/null 2>&1 && exit 0; sleep 1; done; echo "Default audio sink did not become ready" >&2; exit 1'
