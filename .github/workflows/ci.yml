name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            case "$(head -n 1 "$file" 2>/dev/null || true)" in
              *bash*) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
            printf 'syntax OK: %s\n' "$file"
          done < <(
            find . -type f \
              \( -name '*.sh' -o -path './tools/darkstar-grub/05_darkstar_theme' \) \
              -print0
          )

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import ast
          from pathlib import Path

          for path in Path("tools").rglob("*.py"):
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )
              print(f"syntax OK: {path}")
          PYTHON

      - name: Reject private or generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r -d '' file; do
            lower=${file,,}
            case "$lower" in
              *.efi|*.iso|*.img|*.rom|*.fd|*.cap|*.bin|*.hcd|*.bmp|*.pf2|*.ko|*.o|*.key|*.pem|*.der|*.pub|*.auth|*.esl|*.nvram|*.vars|*.p12|*.pfx|*.crt|*.cer|*.tar|*.tar.gz|*.tgz|*.zip|*.7z)
                printf 'forbidden tracked artifact: %s\n' "$file" >&2
                failed=1
                ;;
            esac
          done < <(git ls-files -z)

          if git grep -I -n -E -- \
            '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' \
            -- ':!.github/workflows/ci.yml'
          then
            printf 'private-key material found in tracked text\n' >&2
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Check repository whitespace
        shell: bash
        run: |
          set -euo pipefail
          empty_tree=$(git hash-object -t tree /dev/null)

          # Git treats Markdown's valid two-space hard line break as ordinary
          # trailing whitespace. Keep the strict native check for every other
          # tracked file, then validate Markdown with that one narrow exception.
          git diff --check "$empty_tree" HEAD -- \
            . \
            ':(exclude,glob)**/*.md' \
            ':(exclude,glob)*.md'

          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys

          raw_paths = subprocess.check_output(
              ["git", "ls-files", "-z", "*.md"],
          )
          failed = False

          for raw_path in raw_paths.split(b"\0"):
              if not raw_path:
                  continue

              path = Path(raw_path.decode("utf-8", "surrogateescape"))

              for number, raw_line in enumerate(path.read_bytes().splitlines(), 1):
                  line = raw_line.rstrip(b"\r")
                  stripped = line.rstrip(b" \t")
                  suffix = line[len(stripped):]

                  if suffix == b"  " and stripped:
                      continue

                  if suffix:
                      printable = suffix.replace(b"\t", b"\\t").decode("ascii")
                      print(
                          f"{path}:{number}: invalid trailing whitespace: "
                          f"{printable!r}",
                          file=sys.stderr,
                      )
                      failed = True

                  if line.startswith((b"<<<<<<<", b"=======", b">>>>>>>")):
                      print(f"{path}:{number}: conflict marker", file=sys.stderr)
                      failed = True

          if failed:
              raise SystemExit(1)
          PYTHON
